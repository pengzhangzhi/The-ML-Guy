# The task. Settled with the user before any modelling, frozen by `mlguy init`.
schema_version = "0.1"
name = "protein-solubility"

[task]
type = "classification"
input = "a protein sequence"
output = "soluble_when_expressed"
higher_is_better = true              # label 1 = soluble, and that is the outcome we want

[input]
alphabet = "ACDEFGHIKLMNPQRSTVWY"
# No length and no reference: these are unrelated proteins, 19 to 1,697 residues long.

[data]
source = "https://huggingface.co/datasets/proteinea/solubility (DeepSol, Khurana et al. 2018)"
split = "The DeepSol split as published: sequences clustered by similarity, so the test proteins are not near-duplicates of training ones"
train = "data/train.csv"                        # sequence, target
validation_inputs = "data/validation_inputs.csv" # id, sequence
validation_labels = "data/validation_labels.csv" # id, target
test_inputs = "data/test_inputs.csv"
test_labels = "data/test_labels.csv"            # `mlguy init` moves this out of the project
validation_matches_test = false
validation_note = "The validation set is 58% insoluble, while the test set is a balanced 50/50. Plain accuracy is therefore not comparable between the two, and a model tuned to the validation base rate can look worse on test than it is. Balanced accuracy is the secondary metric for that reason."

[metric]
primary = "accuracy"                 # what the DeepSol and PEER papers report, so numbers compare
secondary = ["balanced_accuracy", "mcc", "roc_auc"]

[budget]
max_submissions = 3
