# Frozen task definition. Everything here is strict; everything about modeling is free.
schema_version = "0.1"
name = "amylase-one-to-many"

[task]
type = "regression"
input = "a protein sequence"
output = "stain_removal_activity"
higher_is_better = true

[input]
alphabet = "ACDEFGHIKLMNPQRSTVWY"
length = 425
# Wild-type B. subtilis alpha-amylase as it appears in the data; used to display mutations.
reference = ""

[data]
source = "https://flip.protein.properties/assets/splits/amylase/one_to_many.csv.gz"
split = "FLIP2 amylase one_to_many, as published"
train = "data/train.csv"
validation = "data/validation.csv"
test = "data/test.csv"               # labelled; `mlguy init` consumes this and hides the labels
test_inputs = "data/test_inputs.csv" # what is left in the project after init
input_columns = ["sequence"]
target_column = "target"
validation_matches_test = false
validation_note = "Validation rows are multi-mutants, like the training rows, while the test rows are single mutants. A model that ranks multi-mutants better does not necessarily rank single mutants better."

[metric]
primary = "spearman"
secondary = ["ndcg"]

[budget]
max_submissions = 3
