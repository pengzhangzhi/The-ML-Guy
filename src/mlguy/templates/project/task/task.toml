# The task. Everything here is settled with the user before any modelling starts, and frozen
# by `mlguy init`. Replace every TODO, then delete this comment block.
schema_version = "0.1"
name = "TODO-project-name"           # short, kebab-case; names the folder under ~/.mlguy/projects/

[task]
type = "regression"                  # regression | classification | generation
input = "TODO what one example is"   # e.g. "a protein sequence", "a cell", "a chest X-ray"
output = "TODO_what_is_predicted"    # e.g. stability, solubility, response, readmission

[data]
source = "TODO where the data came from"
split = "TODO how train/validation/test were separated, in one line"

# Inputs can be in any form: a CSV, an .h5ad, a folder of images or structures. Only the
# project's code reads them. Every example needs an id that the inputs carry.
train = "data/train.csv"                        # inputs and labels together, however suits
validation_inputs = "data/validation_inputs.csv"
test_inputs = "data/test_inputs.csv"

# Labels are always a small CSV with an id column and a target column. For generation there is
# no target: the file lists the conditions to sample for, and anything else the evaluator needs.
validation_labels = "data/validation_labels.csv"
test_labels = "data/test_labels.csv"            # `mlguy init` moves this out of the project
# id_column = "id"
# target_column = "target"

# Does the validation set ask the same question as the test set? If it does not, hill-climbing
# on validation can move away from what the user actually wants. Say so here, and the warning
# follows through to the report.
validation_matches_test = true
# validation_note = "Validation is drawn like the training set, the test set is not, so ..."

# The score comes from task/evaluate.py, written for this problem and frozen with the task.
# `primary` is the name of the metric it reports that the search climbs.
[metric]
primary = "TODO"
direction = "maximize"               # or "minimize"

# [evaluator]
# timeout_minutes = 60

# Generation only (experimental): how many samples are drawn each time, so submissions are
# comparable. The inputs are then the conditions, and the test ones stay unseen until the end.
# `n` is per condition when a labels file lists them, and the whole batch when none does.
# [sampling]
# n = 100                            # per condition, on every submission
# seed = 0
# final_n = 1000                     # for the one final check

[budget]
max_submissions = 10
# max_hours = 6
# deadline = "2026-12-01T09:00:00"
