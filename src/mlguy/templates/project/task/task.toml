# The task. Everything here is settled with the user before any modelling starts, and frozen
# by `mlguy init`. Replace every TODO, then delete this comment block.
schema_version = "0.2"
name = "TODO-project-name"           # short, kebab-case; names the folder under ~/.mlguy/projects/

[task]
input = "TODO what the model is given"     # e.g. "a protein sequence", "a backbone", "a chest X-ray"
output = "TODO what the model returns"     # e.g. "stability", "designed sequences", "a diagnosis"

# A split is up to two things, each in any form (a table, a folder, an .h5ad) or absent:
#   inputs     what infer.py is given
#   reference  what only task/evaluate.py sees: labels, real examples to compare against, anything
# `mlguy init` moves the test inputs and test reference out of the project; they come back once,
# for the final check. Declare no test split at all and the final check reruns validation.
[data]
source = "TODO where the data came from"
split = "TODO how the splits were drawn, in one line"
train = "data/train"                 # yours: never read by mlguy
validation_inputs = "data/validation_inputs.csv"
validation_reference = "data/validation_reference.csv"
test_inputs = "data/test_inputs.csv"
test_reference = "data/test_reference.csv"
# Anything the user should know about the split when they read the score. Quoted word for word
# in the report.
# validation_note = "Validation is drawn like the training set, the test set is not, so ..."

# Extra arguments for infer.py, fixed so that every submission runs the same way. Each entry
# becomes --key value. The final check uses final_args when given.
# [infer]
# args = { n = 20, seed = 0 }
# final_args = { n = 100, seed = 1 }

# The score comes from task/evaluate.py, written for this problem and frozen with the task.
# `primary` is the name of the metric it reports that the search climbs.
[metric]
primary = "TODO"
direction = "maximize"               # or "minimize"

# [evaluator]
# timeout_minutes = 60

# How long the search may run. `hours` is enforced: it counts from `mlguy init`, and `mlguy submit`
# refuses once it is up (`mlguy finish` still runs). Submissions are counted and reported, not
# capped, unless the user wants a cap: then `max_submissions` is enforced too. Any other limit the
# user set goes here under whatever name fits; it is shown to the agent and printed in the report,
# and keeping it is the agent's job.
[budget]
hours = 4
# max_submissions = 20
# max_gpu_hours = 40
# deadline = "2026-12-01"
