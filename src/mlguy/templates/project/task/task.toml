# The task. Everything here is settled with the user before any modelling starts, and frozen
# by `mlguy init`. Replace every TODO, then delete this comment block.
schema_version = "0.1"
name = "TODO-project-name"           # short, kebab-case; names the folder under ~/.mlguy/projects/

[task]
type = "regression"                  # regression | classification | generation
input = "TODO what one row is"       # e.g. "a protein sequence", "a cell and a drug dose"
output = "TODO_what_is_predicted"    # e.g. stability, solubility, response, readmission
higher_is_better = true              # does a larger predicted value mean a better outcome?

[data]
source = "TODO where the data came from"
split = "TODO how train/validation/test were separated, in one line"
train = "data/train.csv"
validation = "data/validation.csv"
test = "data/test.csv"               # labelled; `mlguy init` consumes this and hides the labels
test_inputs = "data/test_inputs.csv" # what is left in the project after init
input_columns = ["TODO"]             # the columns handed to predict.py: text, numbers, categories
target_column = "target"

# Does the validation set ask the same question as the test set? If it does not, hill-climbing
# on validation can move away from what the user actually wants. Say so here, and the warning
# follows through to the report.
validation_matches_test = true
# validation_note = "Validation is drawn like the training set, the test set is not, so ..."

[metric]
# regression:     spearman | pearson | ndcg | rmse | mae
# classification: accuracy | balanced_accuracy | f1 | mcc | roc_auc
# Check the metric against the split: one that moves with the class balance, such as plain
# accuracy, will mislead the search when validation and test are balanced differently.
primary = "spearman"
secondary = []

# When no built-in metric fits (always, for generation) the task carries its own evaluator,
# frozen with everything else in task/. Then `primary` is whatever name it reports.
# [evaluator]
# script = "evaluate.py"             # python evaluate.py --outputs F --split S --result F [--reference F]
# timeout_minutes = 60
# [metric]
# primary = "TODO"
# direction = "maximize"             # or "minimize"

# Generation only: how many samples are drawn each time, so submissions are comparable.
# `input_columns` are then the conditions (leave it empty for unconditional generation), and
# `data.test`, if given, holds conditions kept unseen until the final check.
# [sampling]
# n = 100                            # per condition, on every submission
# seed = 0
# final_n = 1000                     # for the one final check

[budget]
max_submissions = 10
# max_hours = 6
# deadline = "2026-12-01T09:00:00"
