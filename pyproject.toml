[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlguy"
version = "0.0.1"
description = "The-ML-Guy: describe a prediction problem to a coding agent, get back a scored model and a page for using it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]   # scipy: the tests' stand-in evaluator

[project.scripts]
mlguy = "mlguy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlguy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
