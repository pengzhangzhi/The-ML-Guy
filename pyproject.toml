[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlguy"
version = "0.0.1"
description = "The-ML-Guy: describe a prediction problem to a coding agent, get back a scored model and a prediction page."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = ["gradio>=4.44", "matplotlib>=3.8"]
dashboard = ["streamlit>=1.37"]
examples = ["scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
mlguy = "mlguy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlguy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
